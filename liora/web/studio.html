<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liora</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #12100e;
        --panel: #24201c;
        --line: #403830;
        --cream: #f4efe8;
        --mist: #b7ab9e;
        --faint: #8c8074;
        --brass: #e2a04a;
        --clay: #c4654a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--ink);
        color: var(--cream);
        font: 16px/1.45 Outfit, "Segoe UI", sans-serif;
      }
      header, main { max-width: 880px; margin: 0 auto; padding: 1.25rem; }
      header { display: flex; justify-content: space-between; align-items: end; gap: 1rem; }
      h1 { font-family: Georgia, serif; font-weight: 500; font-style: italic; font-size: 2.4rem; margin: 0; }
      .kicker { letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); font-size: 0.72rem; }
      textarea, input, select, button { font: inherit; color: inherit; }
      textarea, input, select {
        width: 100%;
        background: var(--ink);
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        padding: 0.7rem 0.8rem;
      }
      textarea { min-height: 8rem; resize: vertical; }
      label { display: grid; gap: 0.35rem; color: var(--mist); font-size: 0.9rem; }
      .grid { display: grid; gap: 0.8rem; grid-template-columns: 1fr 1fr; }
      button {
        background: var(--brass);
        color: var(--ink);
        border: 0;
        border-radius: 999px;
        min-height: 2.75rem;
        padding: 0.4rem 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .ghost { background: transparent; color: var(--cream); border: 1px solid var(--line); }
      #status { color: var(--mist); min-height: 1.4rem; }
      #error { color: var(--clay); }
      audio { width: 100%; margin-top: 0.6rem; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.4rem; max-height: 16rem; overflow: auto; }
      li button { width: 100%; text-align: left; background: var(--panel); color: var(--cream); border-radius: 0.7rem; }
      @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p class="kicker">Offline · Stable Audio 3</p>
        <h1>Liora</h1>
      </div>
      <p id="device" class="kicker">checking the GPU…</p>
    </header>
    <main>
      <label>Prompt<textarea id="prompt">Warm cinematic strings and felt piano, hopeful, 72 BPM, key of D major, instrumental</textarea></label>
      <div class="grid" style="margin-top: 0.8rem">
        <label>Model
          <select id="model">
            <option value="auto">Auto</option>
            <option value="small-music">Small-Music</option>
            <option value="medium">Medium</option>
          </select>
        </label>
        <label>Seconds<input id="duration" type="number" min="5" max="380" value="30" /></label>
        <label>Steps<input id="steps" type="number" min="4" max="16" value="8" /></label>
        <label>CFG<input id="cfg" type="number" min="1" max="8" step="0.5" value="1" /></label>
        <label>Seed<input id="seed" type="number" value="-1" /></label>
        <label>Negative<input id="negative" value="vocals, singing, speech, lyrics, low quality" /></label>
      </div>
      <p style="margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap">
        <button id="go">Generate</button>
        <button id="random" class="ghost" type="button">New seed</button>
      </p>
      <p id="status"></p>
      <p id="error"></p>
      <audio id="player" controls></audio>
      <h2 class="kicker" style="margin-top: 1.5rem">Presets</h2>
      <ul id="presets"></ul>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      async function health() {
        const report = await (await fetch("/api/health")).json();
        $("device").textContent = `${report.backend} · ${report.device_name} · use ${report.recommended_model}`;
      }
      async function presets() {
        const rows = await (await fetch("/api/presets")).json();
        const list = $("presets");
        for (const preset of rows) {
          const li = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = `${preset.name} · ${preset.category}`;
          button.onclick = () => {
            $("prompt").value = preset.prompt;
            $("duration").value = preset.duration;
            $("negative").value = preset.negative || "";
            $("steps").value = preset.steps || 8;
            $("cfg").value = preset.cfg || 1;
            if (preset.model) $("model").value = preset.model;
          };
          li.appendChild(button);
          list.appendChild(li);
        }
      }
      async function generate() {
        $("error").textContent = "";
        $("go").disabled = true;
        $("status").textContent = "Sending…";
        const body = {
          prompt: $("prompt").value,
          negative: $("negative").value,
          duration: Number($("duration").value),
          model: $("model").value,
          steps: Number($("steps").value),
          cfg: Number($("cfg").value),
          seed: Number($("seed").value),
          chunked: true,
        };
        try {
          const created = await (await fetch("/api/generate", { method: "POST", body: JSON.stringify(body) })).json();
          for (;;) {
            const job = await (await fetch("/api/jobs/" + created.id)).json();
            $("status").textContent = job.stage || job.status;
            if (job.status === "done") {
              $("player").src = "/api/jobs/" + created.id + "/audio?t=" + Date.now();
              if (job.warnings && job.warnings.length) $("status").textContent = job.warnings.join(" ");
              break;
            }
            if (job.status === "error") {
              $("error").textContent = job.error || "Failed";
              break;
            }
            await new Promise((r) => setTimeout(r, 800));
          }
        } catch (err) {
          $("error").textContent = String(err);
        } finally {
          $("go").disabled = false;
        }
      }
      $("go").onclick = generate;
      $("random").onclick = () => { $("seed").value = "-1"; };
      health().catch((err) => { $("device").textContent = String(err); });
      presets().catch(() => {});
    </script>
  </body>
</html>
